name: Dev — Build on Dev Push

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE PIPELINE OVERVIEW
# ─────────────────────────────────────────────────────────────────────────────
# There are three workflows. Pick the right one:
#
#  dev.yml     (this file)
#    Trigger : push to `dev` (any change to tracked paths)
#    Tags    : :dev  and  :dev-{sha}
#    Audience: adventurous users who want bleeding-edge builds
#    Use case: automatic — fires on every dev push
#
#  beta.yml
#    Trigger : push to `main` (i.e. after merging dev → main)
#    Tags    : :beta  and  :beta-{sha}
#    Audience: regular users — the docker-compose in USER-GUIDE points here
#    Use case: automatic — merge dev to main when tested and ready
#
#  release.yml
#    Trigger : git tag matching v*.*.*  or  v*.*.*-beta
#    Tags    : :<tag>  and  :latest (stable) or :beta (beta tag)
#    Audience: users pinning to a specific version
#    Use case: manual — `git tag v0.3.0-beta && git push --tags`
#
# Normal workflow:
#   1. Work on `dev`, push freely — :dev images rebuild automatically
#   2. Test locally at http://localhost:7777
#   3. When good: merge dev → main — :beta images rebuild automatically
#   4. For a named release: push a version tag — versioned + :latest/:beta float
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - dev
    paths:
      - 'api/**'
      - 'stream/**'
      - 'nginx/**'
      - 'scoreboard.html'
      - 'web/**'
      - 'docs/screenshots/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/scorecastarr
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dev:
    name: Build Dev Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push — API (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:dev-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

      - name: Build & Push — Web/Nginx (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:dev-${{ steps.sha.outputs.short }}

      - name: Build & Push — Stream Manager (dev)
        uses: docker/build-push-action@v5
        with:
          context: ./stream
          file: ./stream/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stream:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stream:dev-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=stream-dev
          cache-to: type=gha,mode=max,scope=stream-dev

      - name: Summary
        run: |
          echo "### Dev images pushed" >> $GITHUB_STEP_SUMMARY
          echo "SHA: ${{ steps.sha.outputs.short }}" >> $GITHUB_STEP_SUMMARY
          echo "Tags: \`:dev\` and \`:dev-${{ steps.sha.outputs.short }}\`" >> $GITHUB_STEP_SUMMARY
