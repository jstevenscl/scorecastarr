name: Main — Build on Main Push

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE PIPELINE OVERVIEW  (see dev.yml for full docs)
# ─────────────────────────────────────────────────────────────────────────────
# dev.yml     → push to `dev`          → :dev tags      (bleeding-edge)
# main.yml    → push to `main`         → :latest tags   (what users pull) ← YOU ARE HERE
# release.yml → git tag v*.*.*         → :{version} tag (pinned installs)
#
# Normal workflow: work on dev → test locally → merge to main → :latest rebuilds
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'stream/**'
      - 'nginx/**'
      - 'scoreboard.html'
      - 'web/**'
      - 'docs/screenshots/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/scorecastarr
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-latest:
    name: Build Latest Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push — API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & Push — Web/Nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest-${{ steps.sha.outputs.short }}

      - name: Build & Push — Stream Manager
        uses: docker/build-push-action@v5
        with:
          context: ./stream
          file: ./stream/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stream:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stream:latest-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=stream
          cache-to: type=gha,mode=max,scope=stream

      - name: Summary
        run: |
          echo "### Latest images pushed" >> $GITHUB_STEP_SUMMARY
          echo "SHA: ${{ steps.sha.outputs.short }}" >> $GITHUB_STEP_SUMMARY
          echo "Tags: \`:latest\` and \`:latest-${{ steps.sha.outputs.short }}\`" >> $GITHUB_STEP_SUMMARY
