name: Release — Build on Version Tag

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE PIPELINE OVERVIEW  (see dev.yml for full docs)
# ─────────────────────────────────────────────────────────────────────────────
# dev.yml     → push to `dev`          → :dev tags   (bleeding-edge)
# beta.yml    → push to `main`         → :beta tags  (regular users)
# release.yml → git tag v*.*.*         → versioned + :latest/:beta ← YOU ARE HERE
#
# To cut a release:
#   git tag v0.3.0-beta && git push --tags   → builds :v0.3.0-beta + :beta
#   git tag v1.0.0      && git push --tags   → builds :v1.0.0      + :latest
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*.*.*-beta'   # beta releases  e.g. v0.0.1-beta
      - 'v[0-9]+.[0-9]+.[0-9]+'  # stable releases e.g. v1.0.0

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/scorecastarr
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    name: Build Release Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Determine if this is a beta or stable release
      - name: Determine release track
        id: track
        run: |
          TAG=${GITHUB_REF##*/}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"-beta" ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
            echo "floating_tag=beta" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "floating_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push — API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ steps.track.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ steps.track.outputs.floating_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Web/Nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ steps.track.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ steps.track.outputs.floating_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Renderer
        uses: docker/build-push-action@v5
        with:
          context: ./renderer
          file: ./renderer/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-renderer:${{ steps.track.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-renderer:${{ steps.track.outputs.floating_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — FFmpeg
        uses: docker/build-push-action@v5
        with:
          context: ./ffmpeg
          file: ./ffmpeg/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ffmpeg:${{ steps.track.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ffmpeg:${{ steps.track.outputs.floating_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 🚀 Release images pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.track.outputs.tag }}\`  |  **Channel:** \`${{ steps.track.outputs.channel }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ env.IMAGE_NAME }}-api:${{ steps.track.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ env.IMAGE_NAME }}-web:${{ steps.track.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ env.IMAGE_NAME }}-renderer:${{ steps.track.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ env.IMAGE_NAME }}-ffmpeg:${{ steps.track.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
