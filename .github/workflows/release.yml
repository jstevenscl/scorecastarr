name: Release — Build on Version Tag

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE PIPELINE OVERVIEW  (see dev.yml for full docs)
# ─────────────────────────────────────────────────────────────────────────────
# dev.yml     → push to `dev`          → :dev tags      (bleeding-edge)
# main.yml    → push to `main`         → :latest tags   (what users pull)
# release.yml → git tag v*.*.*         → :{version} tag (pinned installs) ← YOU ARE HERE
#
# To cut a release:
#   git tag v0.3.0 && git push --tags   → builds :v0.3.0
#   :latest is always handled by main.yml — no need to update it here
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*.*.*-beta'   # beta releases  e.g. v0.0.1-beta
      - 'v[0-9]+.[0-9]+.[0-9]+'  # stable releases e.g. v1.0.0

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/scorecastarr
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    name: Build Release Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version tag
        id: tag
        run: echo "version=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Build & Push — API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ steps.tag.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & Push — Web/Nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ steps.tag.outputs.version }}

      - name: Build & Push — Stream Manager
        uses: docker/build-push-action@v5
        with:
          context: ./stream
          file: ./stream/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stream:${{ steps.tag.outputs.version }}
          cache-from: type=gha,scope=stream
          cache-to: type=gha,mode=max,scope=stream

      - name: Summary
        run: |
          echo "### Release images pushed" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ env.IMAGE_NAME }}-api:${{ steps.tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ env.IMAGE_NAME }}-web:${{ steps.tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ env.IMAGE_NAME }}-stream:${{ steps.tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
